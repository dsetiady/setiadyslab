##############################################################################
# Glances configuration for setiadyslab homelab (Intel NUC, 22 cores, 30 GiB)
#
# Mounted into the container at /etc/glances/glances.conf and selected via
# `glances -w -C /etc/glances/glances.conf`. See INFRASTRUCTURE.md for the
# `docker run` command that wires this up.
##############################################################################

[global]
# Check for newer versions of glances at startup. Off — we pin to the image tag.
check_update=false
# History points kept in memory for the web charts.
history_size=1200

[outputs]
# curses theme (only affects the TTY UI; web theme is a browser cookie).
curse_theme=black

##############################################################################
# Resource thresholds
##############################################################################

[cpu]
careful=50
warning=70
critical=85

[percpu]
careful=50
warning=70
critical=85

[load]
# 22 logical cores → green <50%, yellow 50–75%, red >75% of cores.
careful=11
warning=14
critical=16

[mem]
careful=50
warning=70
critical=85

[memswap]
careful=20
warning=40
critical=70

# FS plugin disabled — inside the container, /proc/mounts only shows the overlay
# rootfs and bind-mounted single files, so the panel would be misleading. We use
# the folders plugin (below) to monitor real host paths instead.
[fs]
disable=true

[diskio]
# Hide loop devices (snap), CD/ROM, ram disks.
hide=loop.*,sr.*,ram.*

[network]
# Hide loopback, docker bridges, swarm overlays, veth pairs.
hide=lo,docker.*,br-.*,veth.*,vxlan.*,nerdctl.*,cni.*

[sensors]
# Keep all temperature/fan sensors visible — useful for a NUC.
temperature_core_careful=60
temperature_core_warning=75
temperature_core_critical=90

##############################################################################
# Folders to watch (homelab-specific)
##############################################################################

[folders]
# /var/lib/docker is bind-mounted ro into the container at the same path
# (see docker run command in INFRASTRUCTURE.md). We only watch the two
# subtrees that don't churn — overlay2 races with image pulls/builds and
# /var/lib/docker as a whole races with the live containers/ log dir.
folder_1_path=/var/lib/docker/volumes
folder_1_careful=50000000000
folder_1_warning=200000000000
folder_1_critical=500000000000

folder_2_path=/var/lib/docker/containers
folder_2_careful=10000000000
folder_2_warning=50000000000
folder_2_critical=100000000000

##############################################################################
# Process list
##############################################################################

[processlist]
# Don't display kernel threads or zombies clutter.
nice_warning=-5,-10,-15,-20
nice_critical=-20

##############################################################################
# Docker plugin
##############################################################################

[docker]
# Per-container CPU/mem thresholds (used for the docker view colors).
cpu_careful=50
cpu_warning=70
cpu_critical=85
mem_careful=50
mem_warning=70
mem_critical=85
# Show all containers (including stopped) — flip to false if you only want running.
all=false

##############################################################################
# Disable plugins that are noisy or irrelevant on this host
##############################################################################

[wifi]
disable=true

[raid]
disable=true

[smart]
disable=true

[ports]
disable=true

[irq]
disable=true

[gpu]
disable=true

[amps]
disable=true

[ip]
# Hides public/private IP from the header — small privacy win for screenshots.
disable=true

[now]
# Server-side clock — we already see local time in our terminal/browser.
disable=true

##############################################################################
# Alerts
##############################################################################

[alert]
max_events=20
min_duration=6
min_interval=6
