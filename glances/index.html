<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glances</title>

  <link rel="icon" type="image/x-icon" href="static/favicon.ico" />
  <script>
    window.__GLANCES__ = {
      'refresh-time': '{{ refresh_time }}'
    }
  </script>
  <script src="static/glances.js" defer></script>
  <style>
    /* Bootstrap's `table-hover` is on both #containers and #processlist tables
       but the dark-theme hover color is so faint it reads as no effect. Force
       a stronger highlight on the containers panel rows. */
    section#containers tbody tr:hover,
    section#containers .table-row:hover {
      background-color: rgba(80, 160, 255, 0.18) !important;
      cursor: default;
    }
  </style>
</head>

<body>
  <div id="app"></div>
</body>

</html>
