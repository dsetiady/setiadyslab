services:
  sugarradar-staging-sucrose:
    image: localhost:5000/sugarradar/sucrose:latest
    container_name: sugarradar-sucrose
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_ADDR=${REDIS_ADDR}
      - AI_PROVIDER=${AI_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - FREE_DAILY_SCAN_LIMIT=${FREE_DAILY_SCAN_LIMIT}
      - MAX_BONUS_SCANS_PER_DAY=${MAX_BONUS_SCANS_PER_DAY}
      - SPACES_ACCESS_KEY=${SPACES_ACCESS_KEY}
      - SPACES_SECRET_KEY=${SPACES_SECRET_KEY}
      - SPACES_REGION=${SPACES_REGION}
      - SPACES_BUCKET=${SPACES_BUCKET}
      - SPACES_ENDPOINT=${SPACES_ENDPOINT}
      - SPACES_CDN_URL=${SPACES_CDN_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
      - GOOGLE_CLIENT_IDS=${GOOGLE_CLIENT_IDS}
      - REVENUECAT_SECRET_KEY=${REVENUECAT_SECRET_KEY}
      - REVENUECAT_PROJECT_ID=${REVENUECAT_PROJECT_ID}
      - REVENUECAT_ENTITLEMENT_ID=${REVENUECAT_ENTITLEMENT_ID}
      - REVENUECAT_SYNC_COOLDOWN_SECONDS=${REVENUECAT_SYNC_COOLDOWN_SECONDS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    depends_on:
      sugarradar-staging-postgres:
        condition: service_healthy
      sugarradar-staging-redis:
        condition: service_healthy
    networks:
      - shared-network
      - sugarradar-internal

  sugarradar-staging-sucrose-worker:
    image: localhost:5000/sugarradar/sucrose-worker:latest
    container_name: sugarradar-sucrose-worker
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_ADDR=${REDIS_ADDR}
      - AI_PROVIDER=${AI_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - FREE_DAILY_SCAN_LIMIT=${FREE_DAILY_SCAN_LIMIT}
      - MAX_BONUS_SCANS_PER_DAY=${MAX_BONUS_SCANS_PER_DAY}
      - SPACES_ACCESS_KEY=${SPACES_ACCESS_KEY}
      - SPACES_SECRET_KEY=${SPACES_SECRET_KEY}
      - SPACES_REGION=${SPACES_REGION}
      - SPACES_BUCKET=${SPACES_BUCKET}
      - SPACES_ENDPOINT=${SPACES_ENDPOINT}
      - SPACES_CDN_URL=${SPACES_CDN_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
      - GOOGLE_CLIENT_IDS=${GOOGLE_CLIENT_IDS}
      - REVENUECAT_SECRET_KEY=${REVENUECAT_SECRET_KEY}
      - REVENUECAT_PROJECT_ID=${REVENUECAT_PROJECT_ID}
      - REVENUECAT_ENTITLEMENT_ID=${REVENUECAT_ENTITLEMENT_ID}
      - REVENUECAT_SYNC_COOLDOWN_SECONDS=${REVENUECAT_SYNC_COOLDOWN_SECONDS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    depends_on:
      sugarradar-staging-postgres:
        condition: service_healthy
      sugarradar-staging-redis:
        condition: service_healthy
    networks:
      - sugarradar-internal

  sugarradar-staging-sucrose-scheduler:
    image: localhost:5000/sugarradar/sucrose-scheduler:latest
    container_name: sugarradar-sucrose-scheduler
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_ADDR=${REDIS_ADDR}
      - AI_PROVIDER=${AI_PROVIDER}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - FREE_DAILY_SCAN_LIMIT=${FREE_DAILY_SCAN_LIMIT}
      - MAX_BONUS_SCANS_PER_DAY=${MAX_BONUS_SCANS_PER_DAY}
      - SPACES_ACCESS_KEY=${SPACES_ACCESS_KEY}
      - SPACES_SECRET_KEY=${SPACES_SECRET_KEY}
      - SPACES_REGION=${SPACES_REGION}
      - SPACES_BUCKET=${SPACES_BUCKET}
      - SPACES_ENDPOINT=${SPACES_ENDPOINT}
      - SPACES_CDN_URL=${SPACES_CDN_URL}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_FORMAT=${LOG_FORMAT}
      - GOOGLE_CLIENT_IDS=${GOOGLE_CLIENT_IDS}
      - REVENUECAT_SECRET_KEY=${REVENUECAT_SECRET_KEY}
      - REVENUECAT_PROJECT_ID=${REVENUECAT_PROJECT_ID}
      - REVENUECAT_ENTITLEMENT_ID=${REVENUECAT_ENTITLEMENT_ID}
      - REVENUECAT_SYNC_COOLDOWN_SECONDS=${REVENUECAT_SYNC_COOLDOWN_SECONDS}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
    depends_on:
      sugarradar-staging-postgres:
        condition: service_healthy
      sugarradar-staging-redis:
        condition: service_healthy
    networks:
      - sugarradar-internal

  sugarradar-staging-postgres:
    image: postgres:16-alpine
    container_name: sugarradar-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - sugarradar-staging-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sugarradar-internal

  sugarradar-staging-redis:
    image: redis:7-alpine
    container_name: sugarradar-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - sugarradar-staging-redis-data:/data
    networks:
      - sugarradar-internal

  sugarradar-staging-adminer:
    image: adminer:4
    platform: linux/amd64
    container_name: sugarradar-adminer
    restart: unless-stopped
    environment:
      - ADMINER_DEFAULT_SERVER=sugarradar-staging-postgres
    depends_on:
      - sugarradar-staging-postgres
    networks:
      - shared-network
      - sugarradar-internal

  sugarradar-staging-mailpit:
    image: axllent/mailpit:latest
    container_name: sugarradar-staging-mailpit
    restart: unless-stopped
    volumes:
      - sugarradar-staging-mailpit-data:/data
    networks:
      - shared-network
      - sugarradar-internal

  sugarradar-staging-glucose:
    image: localhost:5000/sugarradar/glucose:latest
    container_name: sugarradar-staging-glucose
    restart: unless-stopped
    networks:
      - shared-network
      - sugarradar-internal

  sugarradar-staging-asynqmon:
    image: hibiken/asynqmon:0.7.2
    container_name: sugarradar-staging-asynqmon
    restart: unless-stopped
    environment:
      - REDIS_ADDR=${REDIS_ADDR}
    depends_on:
      - sugarradar-staging-redis
    networks:
      - shared-network
      - sugarradar-internal

volumes:
  sugarradar-staging-postgres-data:
  sugarradar-staging-redis-data:
  sugarradar-staging-mailpit-data:

networks:
  shared-network:
    external: true
  sugarradar-internal:
    driver: bridge
