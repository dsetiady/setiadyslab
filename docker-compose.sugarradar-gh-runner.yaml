services:
  sugarradar-gh-runner:
    image: myoung34/github-runner:latest
    container_name: sugarradar-gh-runner
    hostname: homelab-1
    privileged: true
    # The image's entrypoint reads $ACCESS_TOKEN directly and does not support the
    # _FILE suffix convention, so we wrap it to load the PAT from the swarm secret.
    # The trailing "$$@" forwards the image's CMD (./bin/Runner.Listener ...) so the
    # listener actually starts after registration.
    entrypoint:
      - /bin/bash
      - -c
      - export ACCESS_TOKEN="$$(cat /run/secrets/gh_runner_pat)" && exec /entrypoint.sh "$$@"
      - bash
    # Compose's entrypoint override clears the image CMD, so re-declare it.
    command: ["./bin/Runner.Listener", "run", "--startuptype", "service"]
    environment:
      - REPO_URL=https://github.com/lajuladotapp/sugarradar
      - RUNNER_NAME=sugarradar-setiadyslabs-1
      - RUNNER_SCOPE=repo
      - LABELS=self-hosted,linux,kvm
      - RUNNER_WORKDIR=/runner-work
      - DISABLE_AUTO_UPDATE=true
    secrets:
      - gh_runner_pat
    volumes:
      - sugarradar-gh-runner-work:/runner-work
      - /var/run/docker.sock:/var/run/docker.sock
      # Bind ensures the /dev/kvm node is actually present in the container.
      # Swarm strips `devices:` silently, so this volume bind is what makes
      # the node visible; the `devices:` entry below is a cgroup hint for
      # non-Swarm runtimes.
      - /dev/kvm:/dev/kvm
    devices:
      - "/dev/kvm:/dev/kvm:rwm"
    cap_add:
      - SYS_ADMIN
    security_opt:
      - "seccomp=unconfined"
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any
        delay: 10s
      placement:
        constraints:
          - node.labels.kvm == true
      resources:
        limits:
          memory: 16G
          cpus: "4.0"
        reservations:
          memory: 8G
          cpus: "2.0"

volumes:
  sugarradar-gh-runner-work:

secrets:
  gh_runner_pat:
    external: true
    name: setiadyslab_sugarradar_action_runner
