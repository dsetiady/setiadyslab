# Non-swarm compose file. Run with `docker compose up -d` on the host
# (NOT `docker stack deploy`). Swarm strips both `devices:` and
# `device_cgroup_rules:`, so the runner can't get cgroup access to /dev/kvm
# as a swarm service. See INFRASTRUCTURE.md for deployment steps.
name: sugarradar-gh-runner

services:
  sugarradar-gh-runner:
    image: myoung34/github-runner:latest
    container_name: sugarradar-gh-runner
    hostname: homelab-1
    restart: unless-stopped
    privileged: true
    mem_limit: 16g
    cpus: 4.0
    # The image's entrypoint reads $ACCESS_TOKEN directly and does not support
    # the _FILE suffix convention, so we wrap it to load the PAT from the
    # bind-mounted secret. The trailing "$$@" forwards the image's CMD
    # (./bin/Runner.Listener ...) so the listener actually starts after
    # registration.
    entrypoint:
      - /bin/bash
      - -c
      - export ACCESS_TOKEN="$$(cat /run/secrets/gh_runner_pat)" && exec /entrypoint.sh "$$@"
      - bash
    # Compose's entrypoint override clears the image CMD, so re-declare it.
    command: ["./bin/Runner.Listener", "run", "--startuptype", "service"]
    environment:
      - REPO_URL=https://github.com/lajuladotapp/sugarradar
      - RUNNER_NAME=sugarradar-setiadyslabs-1
      - RUNNER_SCOPE=repo
      - LABELS=self-hosted,linux,kvm
      - RUNNER_WORKDIR=/runner-work
      - DISABLE_AUTO_UPDATE=true
    secrets:
      - gh_runner_pat
    volumes:
      - sugarradar-gh-runner-work:/runner-work
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev/kvm:/dev/kvm
    # Major 10, minor 232 = /dev/kvm (verify with `ls -la /dev/kvm` on host).
    # This is what actually grants cgroup access — privileged alone is not
    # enough on cgroup v2 hosts, where device control is BPF-managed.
    device_cgroup_rules:
      - 'c 10:232 rwm'
    cap_add:
      - SYS_ADMIN
    security_opt:
      - "seccomp=unconfined"

volumes:
  sugarradar-gh-runner-work:

secrets:
  gh_runner_pat:
    # PAT lives at this path on the host, mode 0600. Keep it out of the repo.
    file: /home/dennysetiady/secrets/gh_runner_pat
