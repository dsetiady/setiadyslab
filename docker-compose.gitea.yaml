services:
  gitea:
    image: gitea/gitea:latest
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea-db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
      - GITEA__server__DOMAIN=gitea.setiady.com
      - GITEA__server__ROOT_URL=https://gitea.setiady.com
      - GITEA__server__HTTP_PORT=3000
      - GITEA__packages__ENABLED=true
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - shared-network
      - gitea-internal
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any

  gitea-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=gitea
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=${GITEA_DB_PASSWORD}
    volumes:
      - gitea_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitea -d gitea"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gitea-internal
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: any

volumes:
  gitea_data:
  gitea_db_data:

networks:
  shared-network:
    external: true
  gitea-internal:
    driver: overlay
