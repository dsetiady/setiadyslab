services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN}
    extra_hosts:
      - "setiadyslabs:host-gateway"
    networks:
      - shared-network

networks:
  shared-network:
    external: true
