# Observability Stack — Loki + Promtail + Grafana
# Shared across all projects on the homelab.
#
# Deploy via Portainer as stack "observability".
#
# Prerequisites:
#   1. Create these configs in Portainer (Configs section) BEFORE deploying:
#      - observability_loki_config
#      - observability_promtail_config
#      - observability_grafana_datasource
#      - observability_grafana_dashboard_provider
#      - observability_grafana_dashboard_sugarradar
#   2. Set GRAFANA_ADMIN_PASSWORD in Portainer stack env vars.
#
# See bottom of this file for the content of each config.

services:
  observability-loki:
    image: grafana/loki:3.0.0
    container_name: observability-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yaml
    configs:
      - source: observability_loki_config
        target: /etc/loki/config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - observability-internal
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  observability-promtail:
    image: grafana/promtail:3.0.0
    container_name: observability-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yaml
    configs:
      - source: observability_promtail_config
        target: /etc/promtail/config.yaml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail-positions:/tmp
    depends_on:
      - observability-loki
    networks:
      - observability-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  observability-grafana:
    image: grafana/grafana:11.0.0
    container_name: observability-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SERVER_ROOT_URL=https://grafana.setiady.com
    configs:
      - source: observability_grafana_datasource
        target: /etc/grafana/provisioning/datasources/loki.yaml
      - source: observability_grafana_dashboard_provider
        target: /etc/grafana/provisioning/dashboards/default.yaml
      - source: observability_grafana_dashboard_sugarradar
        target: /var/lib/grafana/dashboards/sugarradar-staging.json
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "9001:3000"
    depends_on:
      - observability-loki
    networks:
      - shared-network
      - observability-internal
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

configs:
  observability_loki_config:
    external: true
  observability_promtail_config:
    external: true
  observability_grafana_datasource:
    external: true
  observability_grafana_dashboard_provider:
    external: true
  observability_grafana_dashboard_sugarradar:
    external: true

volumes:
  loki-data:
  grafana-data:
  promtail-positions:

networks:
  shared-network:
    external: true
  observability-internal:
    driver: overlay

